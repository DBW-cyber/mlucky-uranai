<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表示テスト</title>
<style>
  body { background:#0d1124; color:#ffd94d; font-family:sans-serif; padding:24px; }
  #out { font-size:40px; line-height:1.6; font-weight:700; word-break:break-all; }
  p { font-size:22px; color:#edeade; }
</style>
</head>
<body>
<p>表示テストページ（数字が大きく出ます）</p>
<div id="out">読み込み中…</div>
<script>
try {
  var vv = window.visualViewport;
  document.getElementById('out').textContent =
    'inner=' + window.innerWidth + 'x' + window.innerHeight +
    ' dpr=' + window.devicePixelRatio +
    ' scale=' + (vv ? vv.scale.toFixed(2) : '?') +
    ' screen=' + screen.width;
} catch(e) { document.getElementById('out').textContent = 'エラー: ' + e.message; }
</script>
</body>
</html>
